<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enemy Field Guide</title><style>*{box-sizing:border-box}body{margin:0;background:#202b25;color:#f4edda;font:16px/1.55 system-ui}main{max-width:1050px;margin:auto;padding:28px}h1{margin:0;color:#f5d792}header p{color:#bfcdbd}article{display:grid;grid-template-columns:190px 210px 1fr;align-items:center;gap:20px;padding:20px 0;border-top:1px solid #52604b}canvas{width:190px;height:170px;background:radial-gradient(ellipse,#586849,#334333);border-radius:12px}h2{font-size:20px;margin:0 0 8px}small{color:#c7d1bd}article p{margin:0}a{color:#f5d792}@media(max-width:700px){article{grid-template-columns:140px 1fr;gap:14px}canvas{width:140px;height:125px}article p{grid-column:1/-1}}@media(prefers-reduced-motion:reduce){canvas{animation:none}}</style></head><body><main><header><h1>Enemy Field Guide</h1><p id="intro"></p><p>Actual game artwork · Ordered by first appearance · Portraits enlarged for clarity</p></header><section id="enemies"></section></main><script src="data.js"></script><script src="serpent-mechanics.js"></script><script src="toolmaker-mechanics.js"></script><script src="pirate-mechanics.js"></script><script src="turtle-mechanics.js"></script><script src="abomination-mechanics.js"></script><script src="water-beast-mechanics.js"></script><script src="attack-rotation.js"></script><script src="engine.js"></script><script src="audio.js"></script><script src="upgrade-looks.js"></script><script src="boss-art.js"></script><script src="undead-art.js"></script><script src="skull-screecher-art.js"></script><script src="hellhound-art.js"></script><script src="shadow-art.js"></script><script src="headless-art.js"></script><script src="fusion-art.js"></script><script src="werewolf-art.js"></script><script src="nightmare-patterns.js"></script><script src="nightmare-art.js"></script><script src="marsh-art.js"></script><script src="volcano-art.js"></script><script src="serpent-art.js"></script><script src="toolmaker-art.js"></script><script src="pirate-art.js"></script><script src="turtle-art.js"></script><script src="abomination-art.js"></script><script src="water-beast-art.js"></script><script src="camoflauger-art.js"></script><script src="ironling-art.js"></script><script src="drawing-art.js"></script><script src="battle-visuals.js"></script><script src="ability-visuals.js"></script><script src="upgrade-viewer.js"></script><script>
const g=new GameEngine.Game(),rows=[],types=Object.keys(GameData.enemies).sort((a,b)=>GameData.enemies[a].wave-GameData.enemies[b].wave);document.getElementById('intro').textContent=types.length+' enemies, with their current abilities and immunities.';
for(const type of types){const d=GameData.enemies[type],row=document.createElement('article'),canvas=document.createElement('canvas');canvas.width=380;canvas.height=340;canvas.setAttribute('aria-label',d.name+' in-game appearance');row.append(canvas);const title=document.createElement('div'),name=document.createElement('h2'),round=document.createElement('small'),desc=document.createElement('p');name.textContent=d.name;round.textContent='First appears: round '+d.wave;desc.textContent=d.hint;title.append(name,round);row.append(title,desc);document.getElementById('enemies').append(row);const e=g.spawn(type,false,300);rows.push({type,e,c:canvas.getContext('2d')});}
function draw(ms){const time=matchMedia('(prefers-reduced-motion: reduce)').matches?1:ms/1000;for(const {type,e,c} of rows){c.clearRect(0,0,380,340);c.save();const scale=type==='nightmare'?1.65:type==='dragon'?1.25:type==='giant'?1.55:type==='werewolf'?1.45:type==='fusion'?2:2.6;c.translate(190,type==='nightmare'?290:235);c.scale(scale,scale);const specimen={...e,x:0,y:0,p:300+time*30,born:time};if(type==='nightmare')NightmareArt.draw(c,specimen,time,g.nightmareFlight(e));else CartoonArt.enemy(c,specimen,time);c.restore();}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></body></html>
