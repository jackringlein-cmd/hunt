const g=new GameEngine.Game(),c=document.getElementById('preview').getContext('2d');const enemies=[g.spawn('ironling',false,450),g.spawn('camoflauger',false,230)];const knight={id:1,type:'knight',x:390,y:245,u:[0,0,0,0]};let paused=false,zoom=false,last=0,time=0;document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Play':'Pause';};document.getElementById('zoom').onclick=()=>{zoom=!zoom;document.getElementById('zoom').textContent=zoom?'Actual size':'Zoom in';};function frame(now){const dt=Math.min(.05,(now-(last||now))/1000);last=now;if(!paused){time+=dt;for(const e of enemies){e.danceTravel=(e.danceTravel??e.p)+e.speed*dt;e.p+=e.speed*dt;if(e.p>900)e.p=230;Object.assign(e,g.position(e.p));}}c.save();if(zoom){c.translate(-140,-90);c.scale(1.6,1.6);}CartoonArt.map(c,g);for(const t of g.s.trees)CartoonArt.tree(c,t.x,t.y,1);CartoonArt.hero(c,knight,{time,active:false});for(const e of enemies){CartoonArt.enemy(c,{...e,p:e.danceTravel??e.p},time);c.font='bold 15px system-ui';c.textAlign='center';const name=GameData.enemies[e.type].name,w=c.measureText(name).width+18;c.fillStyle='#243023ee';c.fillRect(e.x-w/2,e.y-92,w,23);c.fillStyle='#fff4d4';c.fillText(name,e.x,e.y-75);}c.restore();requestAnimationFrame(frame);}requestAnimationFrame(frame);
